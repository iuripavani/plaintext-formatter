name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify release tag matches extension version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Release tag '$RELEASE_TAG' must match package.json version 'v$VERSION'." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Run VS Code integration tests
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: stable

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Package extension
        run: npm run package

      - name: Create GitHub Release and upload VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.vsix --clobber
          else
            gh release create "$RELEASE_TAG" ./*.vsix \
              --verify-tag \
              --generate-notes \
              --title "Plaintext Formatter $RELEASE_TAG"
          fi
