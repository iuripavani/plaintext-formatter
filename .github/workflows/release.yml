name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify release tag matches extension version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Release tag '$RELEASE_TAG' must match package.json version 'v$VERSION'." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Run VS Code integration tests
        run: xvfb-run -a npm run test:integration
        env:
          VSCODE_TEST_VERSION: stable

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Package extension
        run: npm run package

      - name: Upload VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" ./*.vsix --clobber

      - name: Publish to Visual Studio Marketplace
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          npx vsce publish --oidc --skip-duplicate --packagePath "plaintext-formatter-$VERSION.vsix"
